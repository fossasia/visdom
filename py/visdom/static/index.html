    <!-- Custom styles for this template -->
    <script>
    function getActiveEnvFromPath() {
      var path = window.location.pathname || '';
      if (path.includes('/env/')) {
        try {
          return decodeURIComponent(path.split('/env/')[1]);
        } catch (e) {
          return '';
        }
      }
      if (path.includes('/compare/')) {
        try {
          return decodeURIComponent(path.split('/compare/')[1]);
        } catch (e) {
          return '';
        }
      }
      return '';
    }
    var ACTIVE_ENV = getActiveEnvFromPath();
    var USE_POLLING = ('{{wrap_socket}}' == 'True');

    </script>
