    <!-- Mathjax -->

    <!-- Custom styles for this template -->
    <script>
    // The route is whichever of /env/ and /compare/ comes first in the path;
    // the env names after it may contain '+' or those words themselves.
    function getActiveRoute() {
      var path = window.location.pathname || '';
      var env = path.indexOf('/env/');
      var compare = path.indexOf('/compare/');
      var isCompare = compare !== -1 && (env === -1 || compare < env);
      var start = isCompare ? compare + '/compare/'.length
        : env !== -1 ? env + '/env/'.length : -1;
      var name = '';
      if (start !== -1) {
        try {
          name = decodeURIComponent(path.slice(start));
        } catch (e) {
          name = '';
        }
      }
      return { name: name, isCompare: isCompare };
    }
    var ACTIVE_ROUTE = getActiveRoute();
    var ACTIVE_ENV = ACTIVE_ROUTE.name;
    // Only a /compare/ page joins several envs with '+'.
    var ACTIVE_ENV_IS_COMPARE = ACTIVE_ROUTE.isCompare;
    var USE_POLLING = ('{{wrap_socket}}' == 'True');

    </script>
    <script src={{ static_url("js/main.js") }}></script>
