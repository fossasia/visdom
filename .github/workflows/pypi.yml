name: Deploy to PyPI

on:
  push:
    branches:
      - main
    paths:
        - 'py/visdom/VERSION'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload, e.g. v0.3.0'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: "Deploy to PyPI"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.sha }}
      - name: Get git-tags
        run: |
          git fetch --prune --unshallow --tags
          git tag --list
      - name: Retrieve version
        run: |
          echo "TAG_NAME=$(cat py/visdom/VERSION)" >> $GITHUB_OUTPUT
          echo "TAG_EXISTS=$(git tag | grep -Fxc "v$(cat py/visdom/VERSION)")" >> $GITHUB_OUTPUT
        id: version
      - name: Decide whether to publish
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            [ "${{ steps.version.outputs.TAG_EXISTS }}" = "0" ] && echo "publish=true" >> $GITHUB_OUTPUT || echo "publish=false" >> $GITHUB_OUTPUT
          else
            SELECTED_TAG="${{ inputs.tag || github.event.release.tag_name }}"
            if [ "$SELECTED_TAG" = "v${{ steps.version.outputs.TAG_NAME }}" ] && git show-ref --verify --quiet "refs/tags/$SELECTED_TAG"; then
              echo "publish=true" >> $GITHUB_OUTPUT
            else
              echo "publish=false" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Verify the selected tag
        if: ${{ github.event_name != 'push' && steps.gate.outputs.publish != 'true' }}
        run: |
          echo "Refusing to publish." >&2
          echo "Selected tag: ${{ inputs.tag || github.event.release.tag_name }}" >&2
          echo "Version at that ref: v${{ steps.version.outputs.TAG_NAME }}" >&2
          echo "The tag must exist and match the version in py/visdom/VERSION." >&2
          exit 1
      - name: Show version
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Version name: ${{ steps.version.outputs.TAG_NAME }}"
          echo "Existing Matching Tags: ${{ steps.version.outputs.TAG_EXISTS }}"
          echo "Publishing: ${{ steps.gate.outputs.publish }}"
      - name: Create Release
        if: ${{ github.event_name == 'push' && steps.gate.outputs.publish == 'true' }}
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.TAG_NAME }}
          name: "Visdom v${{ steps.version.outputs.TAG_NAME }}"
          generate_release_notes: true
      - name: Set up Python
        if: ${{ steps.gate.outputs.publish == 'true' }}
        uses: actions/setup-python@v7
        with:
            python-version: '3.x'
      - name: Install dependencies
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: python setup.py sdist
      - name: Publish a Python distribution to PyPI
        if: ${{ steps.gate.outputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
            user: __token__
            password: ${{ secrets.pypi_password }}

# Guide: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions
