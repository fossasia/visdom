name: Python Tests

on:
  pull_request:
  push:
    branches:
      - master
      - dev

jobs:
  # Fast gate: the unit tests need no Application and no HTTP, so they finish in
  # about a second. Running them first means an obvious break fails the workflow
  # before the matrix below spends time installing torch three times over.
  unit:
    name: "unit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r test-requirements.txt
      - name: Run unit tests
        run: pytest -m unit

  pytest:
    name: "pytest (Python ${{ matrix.python-version }})"
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r test-requirements.txt
      # The coverage flags live here rather than in pyproject's addopts: a floor
      # is meaningless on the single-file runs developers do all day, and
      # addopts would make every local pytest hard-require pytest-cov.
      # Floor is 80 against a measured 84 -- enough headroom that an unrelated
      # PR does not go red on rounding, tight enough to catch a real regression.
      - name: Run pytest with coverage
        run: >-
          pytest -m "not server"
          --cov=visdom
          --cov-report=term-missing
          --cov-fail-under=80
